<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #7C3AED; --primary-light: #A855F7;
      --bg: #0A0A0F; --bg2: #111118; --bg3: #1A1A25;
      --border: rgba(124,58,237,0.2); --text: #E2E8F0; --muted: #94A3B8;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 3rem; background: rgba(10,10,15,0.95);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.4rem; font-weight: 800; text-decoration: none; color: white; }
    .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .logo span { background: linear-gradient(135deg, #A855F7, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-info { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary); }
    .logout-btn { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: #FF4444; padding: 0.4rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.85rem; transition: all 0.2s; }
    .logout-btn:hover { background: rgba(255,68,68,0.2); }

    main { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }

    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); margin-bottom: 3rem; }

    .guilds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }

    .guild-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1rem;
      transition: all 0.3s;
    }
    .guild-card:hover { border-color: rgba(124,58,237,0.5); transform: translateY(-2px); box-shadow: 0 10px 40px rgba(124,58,237,0.15); }
    .guild-header { display: flex; align-items: center; gap: 1rem; }
    .guild-icon { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; }
    .guild-icon-placeholder { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; }
    .guild-name { font-weight: 700; font-size: 1rem; }
    .guild-id { font-size: 0.75rem; color: var(--muted); }

    .guild-badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 600; }
    .badge-active { background: rgba(0,200,100,0.15); color: #00C864; border: 1px solid rgba(0,200,100,0.3); }
    .badge-inactive { background: rgba(255,100,0,0.12); color: #FF6400; border: 1px solid rgba(255,100,0,0.3); }

    .guild-btn {
      display: block; text-align: center; padding: 0.7rem;
      border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      text-decoration: none; transition: all 0.2s;
    }
    .btn-manage { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }
    .btn-manage:hover { box-shadow: 0 6px 20px rgba(124,58,237,0.4); transform: translateY(-1px); }
    .btn-invite { background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }
    .btn-invite:hover { border-color: var(--primary); color: white; }

    .loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 1.1rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">
    <div class="logo-icon">✨</div>
    <span>Nexora</span>
  </a>
  <div class="user-info">
    <img class="user-avatar" id="userAvatar" src="" alt="Avatar" onerror="this.style.display='none'" />
    <span id="userName">Chargement...</span>
    <a href="/logout" class="logout-btn">Déconnexion</a>
  </div>
</nav>

<main>
  <h1>Mes Serveurs</h1>
  <p class="subtitle">Sélectionne un serveur pour le configurer.</p>

  <div class="guilds-grid" id="guildsGrid">
    <div class="loading">
      <div class="spinner"></div>
      Chargement des serveurs...
    </div>
  </div>
</main>

<script>
async function load() {
  const [userRes, guildsRes] = await Promise.all([
    fetch('/api/user'),
    fetch('/api/guilds')
  ]);

  if (!userRes.ok || !guildsRes.ok) {
    window.location.href = '/login';
    return;
  }

  const user = await userRes.json();
  const guilds = await guildsRes.json();

  document.getElementById('userName').textContent = user.username;
  if (user.avatar) {
    document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
  }

  const grid = document.getElementById('guildsGrid');

  if (!guilds.length) {
    grid.innerHTML = '<div class="loading">Aucun serveur trouvé où tu es administrateur.</div>';
    return;
  }

  grid.innerHTML = guilds.map(g => {
    const iconUrl = g.icon
      ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128`
      : null;

    const iconHtml = iconUrl
      ? `<img class="guild-icon" src="${iconUrl}" alt="${g.name}">`
      : `<div class="guild-icon-placeholder">${g.name[0]}</div>`;

    const badge = g.hasBot
      ? '<span class="guild-badge badge-active">✅ Nexora présent</span>'
      : '<span class="guild-badge badge-inactive">➕ Pas encore ajouté</span>';

    const btn = g.hasBot
      ? `<a href="/dashboard/${g.id}" class="guild-btn btn-manage">⚙️ Configurer</a>`
      : `<a href="https://discord.com/api/oauth2/authorize?client_id=${encodeURIComponent('1474345334648864891')}&permissions=8&scope=bot%20applications.commands&guild_id=${g.id}" class="guild-btn btn-invite" target="_blank">➕ Ajouter Nexora</a>`;

    return `
      <div class="guild-card">
        <div class="guild-header">
          ${iconHtml}
          <div>
            <div class="guild-name">${g.name}</div>
            <div class="guild-id">ID: ${g.id}</div>
          </div>
        </div>
        ${badge}
        ${btn}
      </div>
    `;
  }).join('');
}

load();
</script>
</body>
</html>
