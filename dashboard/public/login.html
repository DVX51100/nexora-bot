<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0A0F;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(124,58,237,0.2); top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(168,85,247,0.15); bottom: -50px; right: -50px; }

    .card {
      position: relative;
      z-index: 1;
      background: #111118;
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .logo { font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; }
    .logo span { background: linear-gradient(135deg, #A855F7, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tagline { color: #94A3B8; margin-bottom: 2.5rem; font-size: 0.95rem; }
    .discord-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      background: #5865F2;
      color: white;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .discord-btn:hover { background: #4752C4; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(88,101,242,0.4); }
    .discord-icon { width: 24px; }
    .terms { color: #64748B; font-size: 0.78rem; margin-top: 1.5rem; line-height: 1.5; }
    .back { display: block; margin-top: 1.5rem; color: #94A3B8; text-decoration: none; font-size: 0.85rem; }
    .back:hover { color: white; }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">✨ <span>Nexora</span></div>
  <p class="tagline">Connecte-toi avec Discord pour gérer ton serveur</p>
  <a href="/auth" class="discord-btn">
    <svg class="discord-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.014.043.031.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
    </svg>
    Se connecter avec Discord
  </a>
  <p class="terms">En te connectant, tu acceptes nos conditions d'utilisation. Nexora ne stocke aucune donnée sensible.</p>
  <a href="/" class="back">← Retour à l'accueil</a>
</div>
</body>
</html>
